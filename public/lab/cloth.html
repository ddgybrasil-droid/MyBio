<!doctype html>
<!--
  Ткань — S7 Open Bench · эксперимент 04
  Автор: ASCEND / S7 · Лицензия: MIT

  Полотно на штанге, посчитанное интегратором Верле: частицы помнят прошлое
  положение, скорость получается из разницы. Структурные и диагональные связи
  релаксируются пятнадцать раз за шаг. В режиме разрыва связь, растянутая
  сильнее порога, лопается; треугольники, опиравшиеся на неё, исчезают,
  а индексный буфер пересобирается на лету.

  Управление: тяните ткань указателем или пальцем; T или кнопка — режим
  разрыва; R или кнопка — повесить заново.
  Встраивание: окно принимает postMessage { type: 'pause' | 'resume' }.
  Запуск: откройте файл в браузере с WebGL2 (three.js грузится с jsDelivr).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ткань — S7 Open Bench</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ecebe5; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .caption {
    position: fixed; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    max-width: calc(100% - 32px); padding: 6px 6px 6px 14px; border-radius: 8px; pointer-events: none;
    font: 500 14px/1.3 'Onest Variable', 'Onest', system-ui, sans-serif; color: #151816;
    background: rgba(247, 246, 240, 0.66); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), inset 0 0 0 1px rgba(21, 24, 22, 0.12);
  }
  .caption div { display: grid; gap: 2px; }
  .caption span { font: 500 11px/1.4 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #5b615d; }
  .caption nav { display: flex; gap: 4px; pointer-events: auto; }
  button {
    min-height: 44px; padding: 0 14px; border: 1px solid rgba(21, 24, 22, 0.32); border-radius: 2px;
    background: transparent; color: #151816; font: 500 14px/1 'Onest Variable', 'Onest', system-ui, sans-serif; cursor: pointer;
  }
  button:hover { border-color: #151816; }
  button[aria-pressed='true'] { background: #151816; color: #f7f6f0; border-color: #151816; }
  button:focus-visible { outline: 2px solid #006d67; outline-offset: 3px; }
  @media (prefers-reduced-transparency: reduce) {
    .caption { background: #f7f6f0; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 0 0 1px rgba(21, 24, 22, 0.32); }
  }
</style>
<script>
  window.__s7Fail = function (message) {
    var cap = document.querySelector('.caption span');
    if (cap) cap.textContent = message;
    if (window.parent !== window) window.parent.postMessage({ source: 's7-lab', type: 'error', message: message }, '*');
  };
  window.__s7Watchdog = setTimeout(function () {
    if (!window.__s7Started) window.__s7Fail('Не удалось загрузить three.js с cdn.jsdelivr.net');
  }, 15000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="caption">
  <div><strong>Ткань</strong><span id="hint">S7 · 04 — тяните указателем</span></div>
  <nav aria-label="Управление тканью">
    <button type="button" id="tear" aria-pressed="false">Разрыв</button>
    <button type="button" id="reset">Повесить заново</button>
  </nav>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__s7Started = true;
clearTimeout(window.__s7Watchdog);

const PAPER = 0xecebe5;
const INK = 0x151816;
const embedded = window.parent !== window;
const notify = (type, message) => embedded && window.parent.postMessage({ source: 's7-lab', type, message }, '*');

if (!document.createElement('canvas').getContext('webgl2')) {
  window.__s7Fail('Нужен браузер с поддержкой WebGL2');
  throw new Error('WebGL2 unavailable');
}

const coarse = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.setAttribute('aria-label', 'Тёмное полотно на алюминиевой штанге; его можно тянуть и рвать');

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment();
scene.environment = pmrem.fromScene(room, 0.04).texture;
room.dispose?.();
scene.environmentIntensity = 0.75;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 60);

const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(2.4, 3.6, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 3.5, bottom: -3.5, near: 1, far: 16 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(-4, 2, -3);
scene.add(rim);

const FLOOR_Y = -1.75;
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), new THREE.ShadowMaterial({ color: INK, opacity: 0.14 }));
wall.position.z = -0.9;
wall.receiveShadow = true;
scene.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.ShadowMaterial({ color: INK, opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- Printed fabric texture ---------- */
function fabricTexture() {
  const w = 1024;
  const h = 768;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#232926';
  g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) {
    g.fillStyle = y % 6 === 0 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.05)';
    g.fillRect(0, y, w, 1);
  }
  for (let x = 0; x < w; x += 3) {
    g.fillStyle = 'rgba(255,255,255,0.018)';
    g.fillRect(x, 0, 1, h);
  }
  g.strokeStyle = 'rgba(236,235,229,0.26)';
  g.lineWidth = 1.5;
  for (let x = 64; x < w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 64; y < h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.fillStyle = '#ecebe5';
  for (let i = 0; i < 7; i++) g.fillRect(w - 214 + i * 22, 70, 10, 120);
  g.font = '600 64px system-ui, sans-serif';
  g.fillText('ASCEND / S7', 64, h - 92);
  g.font = '500 20px ui-monospace, monospace';
  g.fillStyle = 'rgba(236,235,229,0.7)';
  g.fillText('OPEN BENCH · 04 · CLOTH', 66, h - 54);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* ---------- Cloth model ---------- */
const COLS = coarse ? 34 : 46;
const ROWS = coarse ? 26 : 34;
const WIDTH = 3.3;
const HEIGHT = WIDTH * (ROWS - 1) / (COLS - 1);
const TOP = 1.32;
const N = COLS * ROWS;
const ITER = 15;
const STEP = 1 / 60;
const TEAR_STRETCH = 1.7;
const MAX_GRAB_STEP = 0.07;

const pos = new Float32Array(N * 3);
const prev = new Float32Array(N * 3);
const pinned = new Uint8Array(N);
const uv = new Float32Array(N * 2);

const cA = [];
const cB = [];
const cRest = [];
const hEdge = new Int32Array(N).fill(-1);
const vEdge = new Int32Array(N).fill(-1);
const dEdge = new Int32Array(N).fill(-1);
const id = (i, j) => j * COLS + i;
function link(a, b) {
  const ax = pos[a * 3] - pos[b * 3];
  const ay = pos[a * 3 + 1] - pos[b * 3 + 1];
  const az = pos[a * 3 + 2] - pos[b * 3 + 2];
  cA.push(a);
  cB.push(b);
  cRest.push(Math.hypot(ax, ay, az));
  return cA.length - 1;
}

for (let j = 0; j < ROWS; j++) {
  for (let i = 0; i < COLS; i++) {
    const p = id(i, j);
    pos[p * 3] = (i / (COLS - 1) - 0.5) * WIDTH;
    pos[p * 3 + 1] = TOP - (j / (ROWS - 1)) * HEIGHT;
    pos[p * 3 + 2] = 0;
    uv[p * 2] = i / (COLS - 1);
    uv[p * 2 + 1] = 1 - j / (ROWS - 1);
  }
}
const rest0 = pos.slice();
for (let j = 0; j < ROWS; j++) {
  for (let i = 0; i < COLS; i++) {
    const p = id(i, j);
    if (i < COLS - 1) hEdge[p] = link(p, id(i + 1, j));
    if (j < ROWS - 1) vEdge[p] = link(p, id(i, j + 1));
    if (i < COLS - 1 && j < ROWS - 1) {
      link(p, id(i + 1, j + 1));
      dEdge[p] = link(id(i + 1, j), id(i, j + 1));
    }
  }
}
const M = cA.length;
const A = Int32Array.from(cA);
const B = Int32Array.from(cB);
const REST = Float32Array.from(cRest);
const alive = new Uint8Array(M);

function hang() {
  pos.set(rest0);
  for (let p = 0; p < N; p++) {
    pos[p * 3 + 2] = Math.sin(p * 12.9898) * 0.002;
    pinned[p] = p < COLS ? 1 : 0;
  }
  prev.set(pos);
  alive.fill(1);
  indexDirty = true;
  grabbed = -1;
}

/* ---------- Geometry ---------- */
const geometry = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
geometry.setAttribute('position', posAttr);
geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
const indexArray = new Uint32Array((COLS - 1) * (ROWS - 1) * 6);
const indexAttr = new THREE.BufferAttribute(indexArray, 1).setUsage(THREE.DynamicDrawUsage);
geometry.setIndex(indexAttr);
geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 12);
geometry.boundingBox = new THREE.Box3(new THREE.Vector3(-12, -12, -12), new THREE.Vector3(12, 12, 12));
let indexDirty = true;

function rebuildIndex() {
  let n = 0;
  for (let j = 0; j < ROWS - 1; j++) {
    for (let i = 0; i < COLS - 1; i++) {
      const p = id(i, j);
      const right = id(i + 1, j);
      const down = id(i, j + 1);
      const diag = alive[dEdge[p]];
      if (diag && alive[hEdge[p]] && alive[vEdge[p]]) {
        indexArray[n++] = p; indexArray[n++] = down; indexArray[n++] = right;
      }
      if (diag && alive[vEdge[right]] && alive[hEdge[down]]) {
        indexArray[n++] = right; indexArray[n++] = down; indexArray[n++] = id(i + 1, j + 1);
      }
    }
  }
  indexArray.fill(0, n);
  geometry.setDrawRange(0, n);
  indexAttr.needsUpdate = true;
  indexDirty = false;
}

const cloth = new THREE.Mesh(
  geometry,
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    map: fabricTexture(),
    roughness: 0.84,
    metalness: 0,
    sheen: 1,
    sheenRoughness: 0.42,
    sheenColor: new THREE.Color(0xc4ccc7),
    side: THREE.DoubleSide,
  }),
);
cloth.castShadow = true;
cloth.receiveShadow = true;
cloth.frustumCulled = false;
scene.add(cloth);

const alu = new THREE.MeshStandardMaterial({ color: 0xdcdedb, metalness: 1, roughness: 0.22 });
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, WIDTH + 0.7, 32), alu);
rod.rotation.z = Math.PI / 2;
rod.position.set(0, TOP + 0.05, 0);
rod.castShadow = true;
scene.add(rod);
const clipGeo = new THREE.BoxGeometry(0.05, 0.11, 0.07);
const clipMat = new THREE.MeshStandardMaterial({ color: INK, roughness: 0.45 });
for (let i = 0; i < COLS; i += 5) {
  const clip = new THREE.Mesh(clipGeo, clipMat);
  clip.position.set((i / (COLS - 1) - 0.5) * WIDTH, TOP + 0.02, 0);
  clip.castShadow = true;
  scene.add(clip);
}

/* ---------- Interaction ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPoint = new THREE.Vector3();
const camDir = new THREE.Vector3();
let grabbed = -1;
let tearMode = false;
const canvas = renderer.domElement;
const tearBtn = document.getElementById('tear');
const hint = document.getElementById('hint');

function setNdc(event) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}

canvas.addEventListener('pointerdown', (event) => {
  setNdc(event);
  const hits = raycaster.intersectObject(cloth, false);
  const face = hits[0]?.face;
  if (!face) return;
  const point = hits[0].point;
  let best = -1;
  let bestD = Infinity;
  for (const v of [face.a, face.b, face.c]) {
    const d = (pos[v * 3] - point.x) ** 2 + (pos[v * 3 + 1] - point.y) ** 2 + (pos[v * 3 + 2] - point.z) ** 2;
    if (d < bestD) { bestD = d; best = v; }
  }
  grabbed = best;
  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, point);
  dragPoint.copy(point);
  canvas.setPointerCapture?.(event.pointerId);
});
canvas.addEventListener('pointermove', (event) => {
  if (grabbed < 0) return;
  setNdc(event);
  raycaster.ray.intersectPlane(dragPlane, dragPoint);
});
const release = () => { grabbed = -1; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function setTear(on) {
  tearMode = on;
  tearBtn.setAttribute('aria-pressed', String(on));
  hint.textContent = on ? 'S7 · 04 — разрыв включён: тяните резко' : 'S7 · 04 — тяните указателем · T — разрыв · R — заново';
}
tearBtn.addEventListener('click', () => setTear(!tearMode));
document.getElementById('reset').addEventListener('click', hang);
window.addEventListener('keydown', (event) => {
  if (event.code === 'KeyT') setTear(!tearMode);
  else if (event.code === 'KeyR') hang();
});

/* ---------- Simulation ---------- */
let simTime = 0;
function simulate() {
  simTime += STEP;
  const damping = 0.992;
  const g = -7.5 * STEP * STEP;
  const gust = 0.35 + 0.65 * Math.max(0, Math.sin(simTime * 0.37));
  for (let p = 0; p < N; p++) {
    if (pinned[p]) continue;
    const o = p * 3;
    const x = pos[o];
    const y = pos[o + 1];
    const z = pos[o + 2];
    const wind = Math.sin(simTime * 1.3 + x * 1.7 + y * 0.9) * 0.9 * gust * STEP * STEP;
    pos[o] += (x - prev[o]) * damping;
    pos[o + 1] += (y - prev[o + 1]) * damping + g;
    pos[o + 2] += (z - prev[o + 2]) * damping + wind;
    prev[o] = x;
    prev[o + 1] = y;
    prev[o + 2] = z;
  }

  if (grabbed >= 0) {
    // The hand moves at a finite speed so the pull spreads through the weave.
    const o = grabbed * 3;
    const dx = dragPoint.x - pos[o];
    const dy = dragPoint.y - pos[o + 1];
    const dz = dragPoint.z - pos[o + 2];
    const len = Math.hypot(dx, dy, dz);
    const k = len > MAX_GRAB_STEP ? MAX_GRAB_STEP / len : 1;
    pos[o] += dx * k;
    pos[o + 1] += dy * k;
    pos[o + 2] += dz * k;
    prev[o] = pos[o];
    prev[o + 1] = pos[o + 1];
    prev[o + 2] = pos[o + 2];
  }

  const limit = tearMode ? TEAR_STRETCH : Infinity;
  for (let it = 0; it < ITER; it++) {
    for (let c = 0; c < M; c++) {
      if (!alive[c]) continue;
      const a = A[c];
      const b = B[c];
      const ao = a * 3;
      const bo = b * 3;
      const dx = pos[bo] - pos[ao];
      const dy = pos[bo + 1] - pos[ao + 1];
      const dz = pos[bo + 2] - pos[ao + 2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
      const rest = REST[c];
      if (d > rest * limit) {
        alive[c] = 0;
        indexDirty = true;
        continue;
      }
      const wa = pinned[a] || a === grabbed ? 0 : 1;
      const wb = pinned[b] || b === grabbed ? 0 : 1;
      const w = wa + wb;
      if (!w) continue;
      const k = (d - rest) / (d * w);
      pos[ao] += dx * k * wa;
      pos[ao + 1] += dy * k * wa;
      pos[ao + 2] += dz * k * wa;
      pos[bo] -= dx * k * wb;
      pos[bo + 1] -= dy * k * wb;
      pos[bo + 2] -= dz * k * wb;
    }
  }

  for (let p = 0; p < N; p++) {
    const o = p * 3;
    if (pos[o + 1] < FLOOR_Y + 0.01) {
      pos[o + 1] = FLOOR_Y + 0.01;
      prev[o] += (pos[o] - prev[o]) * 0.6;
      prev[o + 2] += (pos[o + 2] - prev[o + 2]) * 0.6;
    }
    if (pos[o + 2] < wall.position.z + 0.02) pos[o + 2] = wall.position.z + 0.02;
  }
}

/* ---------- Layout + loop ---------- */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const fit = 1 / Math.min(1, camera.aspect / 1.35);
  camera.position.set(0.35, 0.15, 5.4 * fit);
  camera.lookAt(0, -0.05, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let acc = 0;
let last = 0;
let announced = false;

function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : STEP;
  last = now;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 3) {
    simulate();
    acc -= STEP;
    steps++;
  }
  if (steps === 3) acc = 0;
  if (indexDirty) rebuildIndex();
  posAttr.needsUpdate = true;
  geometry.computeVertexNormals();
  renderer.render(scene, camera);
  if (!announced) {
    announced = true;
    notify('ready');
  }
}

function setRunning(on) {
  last = 0;
  renderer.setAnimationLoop(on ? frame : null);
}

window.addEventListener('message', (event) => {
  const type = event.data && event.data.type;
  if (type === 'pause') setRunning(false);
  else if (type === 'resume') setRunning(true);
});

canvas.addEventListener('webglcontextlost', (event) => {
  event.preventDefault();
  setRunning(false);
});
canvas.addEventListener('webglcontextrestored', () => setRunning(true));

setTear(false);
hang();
setRunning(true);
</script>
</body>
</html>
